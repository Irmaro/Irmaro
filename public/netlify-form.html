<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IRMARO Form Definition</title>
  </head>

  <body>
    <form
      name="irmaro-contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="irmaro-contact" />
      <input type="text" name="bot-field" />
      <input type="hidden" name="language" />
      <input type="hidden" name="package-sessions" />

      <select name="topic">
        <option value="intro-call">Free intro call</option>
        <option value="coaching-session">Single coaching session</option>
        <option value="mentoring-session">Single mentoring session</option>
        <option value="cv-review">CV and cover letter review</option>
        <option value="linkedin-review">LinkedIn profile review</option>
        <option value="interview-preparation">Individual interview preparation</option>
        <option value="coaching-package">Coaching package</option>
        <option value="mentoring-package">Mentoring package</option>
        <option value="other">Other topic</option>
      </select>

      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
